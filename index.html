
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Chilli Hub</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

    :root {
      --red: #ff3030;
      --red-light: #ff6666;
      --bg: #080808;
      --panel: rgba(20, 20, 20, .88);
      --text: #f5f5f5;
      --muted: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #381010 0%, transparent 45%),
        radial-gradient(ellipse at 100% 100%, #260707 0%, transparent 40%),
        var(--bg);
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255, 48, 48, .2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 48, 48, .2) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
      animation: gridMove 16s linear infinite;
    }

    .glow {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(255, 20, 20, .1);
      filter: blur(100px);
      pointer-events: none;
      animation: glowMove 10s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -150px;
      left: -100px;
    }

    .glow.two {
      bottom: -180px;
      right: -100px;
      animation-delay: -4s;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
      animation: enter .9s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 32px 25px 24px;
      border: 1px solid rgba(255, 60, 60, .35);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 35px rgba(255, 0, 0, .09),
        inset 0 0 30px rgba(255, 0, 0, .025);
      transform-style: preserve-3d;
      transition: border-color .3s, box-shadow .3s;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff3030, #fff, #ff3030, transparent);
      animation: scan 5s ease-in-out infinite;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 60, 60, .055), transparent 35%, transparent 70%, rgba(255, 20, 20, .05));
    }

    .status {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 auto 22px;
      padding: 7px 13px;
      border: 1px solid rgba(255, 65, 65, .3);
      border-radius: 30px;
      color: #ff8b8b;
      background: rgba(255, 30, 30, .07);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff3838;
      box-shadow: 0 0 10px #ff3030;
      animation: pulse 1.5s infinite;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 60, 60, .55);
      border-radius: 23px;
      background: linear-gradient(145deg, #301010, #100909);
      box-shadow: 0 0 35px rgba(255, 30, 30, .2), inset 0 0 20px rgba(255, 40, 40, .08);
      animation: logoFloat 3s ease-in-out infinite;
    }

    .logo svg {
      width: 49px;
      height: 49px;
      filter: drop-shadow(0 0 9px rgba(255, 35, 35, .75));
    }

    h1 {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(30px, 8vw, 39px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.3;
      color: #fff;
      text-shadow: 0 0 22px rgba(255, 40, 40, .3);
    }

    h1 span {
      color: var(--red);
      text-shadow: 0 0 20px rgba(255, 35, 35, .6);
    }

    .subtitle {
      margin-top: 10px;
      text-align: center;
      color: #aaa;
      font-size: 16px;
      letter-spacing: 1.5px;
    }

    .divider {
      height: 1px;
      margin: 25px 0;
      background: linear-gradient(90deg, transparent, rgba(255, 60, 60, .6), transparent);
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      color: #eee;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-label svg {
      width: 17px;
      height: 17px;
      stroke: var(--red);
    }

    .key-box {
      position: relative;
      padding: 15px 13px;
      border: 1px solid #353535;
      border-radius: 12px;
      background: rgba(0, 0, 0, .55);
      transition: border-color .3s, box-shadow .3s;
    }

    .key-box:focus-within,
    .key-box:hover {
      border-color: rgba(255, 60, 60, .65);
      box-shadow: 0 0 18px rgba(255, 30, 30, .08);
    }

    .key-value {
      display: block;
      overflow-wrap: anywhere;
      color: #ff7777;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.8;
      user-select: all;
    }

    .copy-btn {
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 13px;
      padding: 15px;
      border: 1px solid #ff4646;
      border-radius: 12px;
      color: white;
      background: linear-gradient(110deg, #b70e0e, #ff3030, #b70e0e);
      background-size: 200% 100%;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: transform .2s, box-shadow .3s, background-position .5s;
    }

    .copy-btn:hover {
      transform: translateY(-2px);
      background-position: 100% 0;
      box-shadow: 0 8px 25px rgba(255, 30, 30, .25);
    }

    .copy-btn:active {
      transform: scale(.98);
    }

    .copy-btn svg {
      width: 18px;
      height: 18px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 23px;
    }

    .feature {
      min-width: 0;
      padding: 13px 5px;
      border: 1px solid #292929;
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 255, 255, .018);
      transition: border-color .3s, transform .3s, background .3s;
    }

    .feature:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 60, 60, .5);
      background: rgba(255, 30, 30, .05);
    }

    .feature svg {
      width: 22px;
      height: 22px;
      margin-bottom: 6px;
      stroke: #ff5555;
    }

    .feature strong {
      display: block;
      color: #f1f1f1;
      font-size: 13px;
      letter-spacing: .5px;
    }

    .feature small {
      display: block;
      margin-top: 3px;
      color: #777;
      font-size: 11px;
    }

    .footer {
      margin-top: 23px;
      text-align: center;
      color: #666;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .footer span {
      color: #ff4141;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 30px);
      padding: 13px 19px;
      border: 1px solid rgba(255, 70, 70, .5);
      border-radius: 12px;
      color: #fff;
      background: #171010;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .4);
      font-size: 15px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
      transition: opacity .3s, transform .3s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast svg {
      width: 19px;
      height: 19px;
      color: #ff5151;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(25px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px #ff3030; }
      50% { opacity: .4; box-shadow: 0 0 3px #ff3030; }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes scan {
      0%, 20% { left: -120%; }
      65%, 100% { left: 150%; }
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 48px 48px; }
    }

    @keyframes glowMove {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(50px, 35px) scale(1.2); }
    }

    @media (max-width: 380px) {
      .card { padding: 27px 17px 21px; }
      .features { gap: 6px; }
      .feature strong { font-size: 12px; }
      .key-value { font-size: 12px; }
      h1 { letter-spacing: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <canvas id="particles"></canvas>

  <main class="container" id="tiltCard">
    <section class="card">
      <div class="status">
        <span class="status-dot"></span>
        System Online
      </div>

      <div class="logo" aria-label="Chilli Hub logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M37 7C42 13 41 18 38 23C47 20 52 12 50 5C60 17 57 28 48 34C56 35 59 43 54 51C48 61 33 61 22 55C9 48 7 34 16 24C18 33 24 35 27 36C23 25 29 14 37 7Z"
            fill="url(#flame)" stroke="#ff7777" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M35 31C40 37 39 42 35 46C32 49 29 48 28 45C26 41 30 36 35 31Z"
            fill="#fff0e8"/>
          <defs>
            <linearGradient id="flame" x1="14" y1="8" x2="52" y2="57" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ff7777"/>
              <stop offset=".5" stop-color="#ff3030"/>
              <stop offset="1" stop-color="#8d0000"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1>CHILLI <span>HUB</span></h1>
      <p class="subtitle">Your key. Your access.</p>

      <div class="divider"></div>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="10" width="18" height="11" rx="2"/>
          <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
        </svg>
        Your Access Key
      </div>

      <div class="key-box">
        <code class="key-value" id="keyValue">ChilliHubKeyKsowowj - LaVisoaowijepoehsb</code>
      </div>

      <button class="copy-btn" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="8" width="13" height="13" rx="2"/>
          <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
        </svg>
        <span id="copyText">COPY KEY</span>
      </button>

      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          <strong>Secure</strong>
          <small>Key Access</small>
        </div>

        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L4 14h7l-1 8 10-13h-7l1-7z"/>
          </svg>
          <strong>Fast</strong>
          <small>Quick Copy</small>
        </div>

        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          <strong>Ready</strong>
          <small>System Online</small>
        </div>
      </div>

      <div class="footer">
        POWERED BY <span>CHILLI HUB</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span id="toastText">Key copied successfully!</span>
  </div>

  <script>
    const keyValue = document.getElementById('keyValue');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const card = document.querySelector('.card');

    let toastTimer;

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    async function copyKey() {
      const key = keyValue.textContent.trim();

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(key);
        } else {
          const temp = document.createElement('textarea');
          temp.value = key;
          temp.style.position = 'fixed';
          temp.style.opacity = '0';
          document.body.appendChild(temp);
          temp.select();

          const success = document.execCommand('copy');
          temp.remove();

          if (!success) throw new Error('Copy failed');
        }

        copyText.textContent = 'COPIED!';
        showToast('Key copied successfully!');

        setTimeout(() => {
          copyText.textContent = 'COPY KEY';
        }, 1800);
      } catch (error) {
        showToast('Copy failed. Please select and copy the key.');
      }
    }

    copyBtn.addEventListener('click', copyKey);

    // Subtle 3D hover effect on desktop
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const container = document.getElementById('tiltCard');

      container.addEventListener('mousemove', (event) => {
        const rect = container.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const rotateY = (x - 0.5) * 5;
        const rotateX = (0.5 - y) * 5;

        card.style.transform =
          `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      container.addEventListener('mouseleave', () => {
        card.style.transform =
          'perspective(1000px) rotateX(0deg) rotateY(0deg)';
      });
    }

    // Animated ember particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.min(65, Math.floor(width / 15));
      particles = Array.from({ length: count }, () => createParticle(true));
    }

    function createParticle(randomY = false) {
      return {
        x: Math.random() * width,
        y: randomY ? Math.random() * height : height + 10,
        size: Math.random() * 2 + .5,
        speedY: Math.random() * .65 + .2,
        speedX: (Math.random() - .5) * .45,
        alpha: Math.random() * .55 + .15,
        phase: Math.random() * Math.PI * 2
      };
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach((p) => {
        p.y -= p.speedY;
        p.x += p.speedX + Math.sin(p.phase) * .15;
        p.phase += .015;

        if (p.y < -10) Object.assign(p, createParticle());

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${35 + Math.floor(p.size * 12)}, 35, ${p.alpha})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff2020';
        ctx.fill();
      });

      ctx.shadowBlur = 0;
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateParticles();
  </script>
</body>
</html>
